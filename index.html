<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>专属校招岗位表</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .steps { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 0; }
  .step { background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 14px 16px; }
  .step b { display: block; margin-bottom: 4px; font-size: 14.5px; }
  .step span { color: var(--sub); font-size: 13px; }
  .step em { font-style: normal; color: var(--brand); font-weight: 600;
             display: inline-block; width: 22px; }
  .contact { text-align: center; margin-top: 16px; color: var(--hint); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1>你的专属校招岗位表</h1>
    <div class="meta">一人一份，按你的学历、专业、意向城市和毕业届次筛出来的岗位。</div>
    <div class="fresh"><span class="dot"></span><span>每天自动更新，链接不变</span></div>
  </header>

  <section class="steps">
    <div class="step"><b><em>1</em>拿到你的专属链接</b>
      <span>下单后客服会把一条专属网址发给你，网址里就带着你的订单号。</span></div>
    <div class="step"><b><em>2</em>收藏它，随时打开</b>
      <span>不用注册、不用登录。加到微信收藏或浏览器书签，随时点开就是最新岗位。</span></div>
    <div class="step"><b><em>3</em>每天来看新岗位</b>
      <span>岗位池每天更新，已投递的、快到期的都能筛出来，不用担心错过。</span></div>
  </section>

  <footer class="note">
    <p>本页只做服务说明，不提供订单号查询入口 —— 为避免他人猜到你的订单号，链接仅通过客服单独发送。</p>
    <p>岗位信息来自公开校招公告，投递前请以企业官方公告为准。</p>
  </footer>

  <div class="contact">如需重新获取链接或咨询服务，请联系发你链接的客服。</div>

</div>
</body>
</html>
